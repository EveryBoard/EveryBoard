<svg xmlns="http://www.w3.org/2000/svg"
     class="board"
     viewBox="0 250 1065 1060"
     preserveAspectRatio="xMidYMid meet">
    @for (line of hexaBoard; track line; let y = $index) {
        <g>
            @for (space of line; track space; let x = $index) {
                <g>
                    @if (space.isReachable()) {
                        <g id="click_{{ x }}_{{ y }}"
                           (click)="onClick(x, y)">
                            <polygon id="space_{{ x }}_{{ y }}"
                                     [attr.points]="getHexaPoints()"
                                     [attr.transform]="getHexaCenterTranslationAtXY(x, y)"
                                     [ngClass]="getSpaceClasses(x, y)"
                                     class="base"
                                     stroke-linecap="round"/>
                            <g id="pieceGroup_{{ x }}_{{ y }}"
                               [ngClass]="getPieceGroupClasses(x, y)"
                               [attr.transform]="getSVGTranslationAt(getCenterAtXY(x, y))">
                                @if (isRing(x, y)) {
                                    <app-ring id="ring_{{ x }}_{{ y }}"
                                              transform="scale(0.43)"
                                              [strokeWidth]="10"
                                              [width]="20"
                                              [midRingClasses]="getRingClasses(x, y)"/>
                                }
                                @if (isMarker(x, y)) {
                                    <circle id="marker_{{ x }}_{{ y }}"
                                            [attr.r]="viewInfo.markerSize"
                                            [ngClass]="getMarkerClasses(x, y)"
                                            class="base mid-stroke"/>
                                }
                            </g>
                        </g>
                    }
                </g>
            }
        </g>
    }
    @for (coord of selectedCoords.union(selectedRings); track coord.toString()) {
        <polygon id="selected_{{ coord.x }}_{{ coord.y }}"
                 (click)="onClick(coord.x, coord.y)"
                 class="base no-fill selected-stroke"
                 [attr.points]="getHexaPoints()"
                 [attr.transform]="getHexaCenterTranslationAt(coord)"
                 pointer-events="fill"
                 stroke-linecap="round"/>
    }
    @for (coord of viewInfo.targets; track coord) {
        <rect id="indicator_{{ coord.x }}_{{ coord.y }}"
              [attr.transform]="getSVGTranslationAt(getCenterAt(coord))"
              [attr.x]=" - viewInfo.indicatorSize/2"
              [attr.y]=" - viewInfo.indicatorSize/2"
              [attr.width]="viewInfo.indicatorSize"
              [attr.height]="viewInfo.indicatorSize"
              (click)="onClick(coord.x, coord.y)"
              class="indicator"/>
    }
    @for (player of Player.PLAYERS; track player) {
        <g [attr.transform]="'rotate(' + ((getPointOfView().getValue() + 1) * 180) + ' 532.5 780)'">
            @for (_ of [].constructor(viewInfo.sideRings.get(player)); track _; let ring = $index) {
                <app-ring id="{{ player.toString() }}_sideRing_{{ ring + 1 }}"
                          [attr.transform]="translateRing(player, ring) + 'scale(0.43)'"
                          [strokeWidth]="10"
                          [width]="20"
                          [midRingClasses]="viewInfo.sideRingClass.get(player)"/>
            }
        </g>
    }
    @for (coord of viewInfo.targets; track coord.toString()) {
        <rect id="indicator_{{ coord.x }}_{{ coord.y }}"
              [attr.transform]="getSVGTranslationAt(getCenterAt(coord))"
              [attr.x]=" - viewInfo.indicatorSize/2"
              [attr.y]=" - viewInfo.indicatorSize/2"
              [attr.width]="viewInfo.indicatorSize"
              [attr.height]="viewInfo.indicatorSize"
              (click)="onClick(coord.x, coord.y)"
              class="indicator"/>
    }
    @for (player of Player.PLAYERS; track player) {
        <g [attr.transform]="'rotate(' + ((getPointOfView().getValue() + 1) * 180) + ' 532.5 780)'">
            @for (_ of [].constructor(viewInfo.sideRings.get(player)); track $index; let ring = $index) {
                <g>
                    <circle id="{{ player.toString() }}_sideRing_{{ ring + 1 }}"
                            [attr.cx]="(player === Player.ZERO ? 15 : 1050) + (player === Player.ZERO ? 1 : -1) * 1.2 * viewInfo.ringOuterSize * (ring + 1)"
                            [attr.cy]="player === Player.ZERO ? 300 : 1260"
                            [attr.r]="viewInfo.ringOuterSize"
                            class="base no-fill mid-stroke"/>
                    <circle [attr.cx]="(player === Player.ZERO ? 15 : 1050) + (player === Player.ZERO ? 1 : -1) * 1.2 * viewInfo.ringOuterSize * (ring + 1)"
                            [attr.cy]="(player === Player.ZERO ? 300 : 1260)"
                            [attr.r]="viewInfo.ringInnerSize"
                            class="base no-fill mid-stroke"/>
                    <circle [attr.cx]="(player === Player.ZERO ? 15 : 1050) + (player === Player.ZERO ? 1 : -1) * 1.2 * viewInfo.ringOuterSize * (ring + 1)"
                            [attr.cy]="player === Player.ZERO ? 300 : 1260"
                            [attr.r]="viewInfo.ringMidSize"
                            [ngClass]="viewInfo.sideRingClass.get(player)"
                            class="base no-fill"/>
                </g>
            }
        </g>
    }
</svg>
