<svg xmlns="http://www.w3.org/2000/svg"
     class="board"
     [attr.viewBox]="viewBoxString()"
     preserveAspectRatio="xMidYMid meet">
    @for (coordAndContent of state.getCoordsAndContents(); track coordAndContent.coord.toString()) {
        <g>
            @if (mustDraw(coordAndContent.coord)) {
                <polygon id="space-{{ coordAndContent.coord.x }}-{{ coordAndContent.coord.y }}"
                         (click)="onSpaceClick(coordAndContent.coord)"
                         [attr.points]="getTrianglePointsAt(coordAndContent.coord)"
                         [attr.transform]="getTriangleInHexTranslation(coordAndContent.coord)"
                         [ngClass]="getSpaceClass(coordAndContent.coord)"
                         class="base big-stroke"
                         stroke-linecap="round"/>
            }
        </g>
    }
    @for (coordAndContent of state.getCoordsAndContents(); track coordAndContent.coord.toString()) {
        <g>
            @if (isPyramid(coordAndContent.coord)) {
                <polygon id="pyramid-{{ coordAndContent.coord.x }}-{{ coordAndContent.coord.y }}"
                         (click)="onPyramidClick(coordAndContent.coord)"
                         [attr.points]="getPyramidPointsAt(coordAndContent.coord)"
                         [attr.transform]="getTriangleInHexTranslation(coordAndContent.coord)"
                         [ngClass]="getPyramidClass(coordAndContent.coord)"
                         class="base mid-stroke"
                         stroke-linecap="round"/>
            }
        </g>
    }
    @if (chosenCoord().isPresent()) {
        @let chosen = chosenCoord().get();
        <g>
            <polygon id="selected-{{ chosen.x }}-{{ chosen.y }}"
                     [attr.points]="getPyramidPointsAt(chosen)"
                     [attr.transform]="getTriangleInHexTranslation(chosen)"
                     class="base no-fill mid-stroke selected-stroke"
                     (click)="onPyramidClick(chosen)"/>
            @for (possibleLanding of possibleLandings(); track possibleLanding.toString()) {
                <polygon id="possible-landing-{{ possibleLanding.x }}-{{ possibleLanding.y }}"
                         class="base no-fill mid-stroke clickable-stroke"
                         [attr.points]="getTrianglePointsAt(possibleLanding)"
                         [attr.transform]="getTriangleInHexTranslation(possibleLanding)"
                         (click)="onSpaceClick(possibleLanding)"/>
            }
        </g>
    } @else {
        @if (lastStart.isPresent()) {
            @let start = lastStart().get();
            <polygon id="last-start-{{ start.x }}-{{ start.y }}"
                     [attr.points]="getTrianglePointsAt(start)"
                     [attr.transform]="getTriangleInHexTranslation(start)"
                     class="base no-fill mid-stroke last-move-stroke"/>
        }
        @if (lastEnd.isPresent()) {
            @let end = lastEnd().get();
            <polygon id="last-end-{{ end.x }}-{{ end.y }}"
                     [attr.points]="getTrianglePointsAt(end)"
                     [attr.transform]="getTriangleInHexTranslation(end)"
                     class="base no-fill mid-stroke last-move-stroke"/>
        }
    }
    @for (player of Player.PLAYERS; track player.getValue()) {
        <g>
            @if (mustShowTilesOf(player)) {
                <g [id]="'tiles-count-' + player.toString()"
                   [attr.transform]="getTilesCountTranslation(player)">
                    <polygon [attr.points]="getTilesCountCoordinate()"
                             [attr.stroke]="lastTurnWasTilesExchange(player) ? 'yellow' : 'black'"
                             [ngClass]="getTilesCountClasses(player)"
                             stroke-linecap="round"/>
                    <text id="player-zero-tiles-count"
                          class="text-giant"
                          x="35"
                          y="45"
                          [attr.font-size]="SPACE_SIZE / 2">{{ tiles().get(player) }}</text>
                </g>
            }
        </g>
    }
</svg>
