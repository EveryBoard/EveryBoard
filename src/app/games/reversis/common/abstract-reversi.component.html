<svg xmlns="http://www.w3.org/2000/svg"
     class="board"
     [attr.viewBox]="viewBoxString()"
     preserveAspectRatio="xMidYMid meet">
    <g id="pieces">
        @for (coordAndContent of coordsAndContents(); track $index) {
            @let coord = coordAndContent.coord;
            @if (coordAndContent.content.isReachable()) {
                <g [attr.transform]="topologicTranslationMap().get(coord).get()">
                    <polygon [attr.id]="'click-' + topologicCellIdMap().get(coord).get()"
                             [attr.points]="topologicPolygonMap().get(coord).get()"
                             (click)="onClick(coord)"
                             class="base"
                             [ngClass]="spaceClassesMap().get(coord).get()"
                    />
                </g>
            }
        }
    </g>
    @if (lastMove().isPresent()) {
        @let coord = lastMove().get();
        <polygon [attr.id]="'last-drop-' + coord.x + '-' + coord.y"
                 [attr.transform]="topologicTranslationMap().get(coord).get()"
                 [attr.points]="topologicPolygonMap().get(coord).get()"
                 class="base"
                 [ngClass]="spaceClassesMap().get(coord).get()"
                 class="base moved-stroke"
        />
    }
</svg>
