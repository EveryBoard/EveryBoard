<svg xmlns="http://www.w3.org/2000/svg"
     class="board"
     [attr.viewBox]="viewBoxString()"
     preserveAspectRatio="xMidYMid meet">

    <g id="reserve-pieces"
       [attr.transform]="boardRotation()">
        @for (piece of sidePieces(); track piece.id) {
            <circle [id]="piece.id"
                    [attr.cx]="piece.cx"
                    [attr.cy]="piece.cy"
                    [attr.r]="piece.radius"
                    [ngClass]="piece.playerClass"
                    class="base mid-stroke"/>
        }
    </g>

    <g #boardInItself
       [attr.transform]="boardTranslation">
        <rect x="-3"
              y="-3"
              [attr.width]="(4 * SPACE_SIZE) + 6"
              [attr.height]="(4 * SPACE_SIZE) + 6"
              class="base mid-stroke"/>
        @for (space of spaces(); track space.key) {
            @if (space.kind === 'piece') {
                <circle id="piece-{{ space.coord.x }}-{{ space.coord.y }}-{{ space.coord.z }}"
                        (click)="onPieceClick(space.coord.x, space.coord.y, space.coord.z)"
                        [attr.r]="space.radius - STROKE_WIDTH"
                        [attr.cx]="space.cx"
                        [attr.cy]="space.cy"
                        [ngClass]="space.classes"
                        class="base mid-stroke"/>
            } @else {
                <rect id="drop-{{ space.coord.x }}-{{ space.coord.y }}-{{ space.coord.z }}"
                      (click)="onDrop(space.coord.x, space.coord.y, space.coord.z)"
                      [attr.width]="space.radius * 2"
                      [attr.height]="space.radius * 2"
                      [attr.x]="space.cx - space.radius"
                      [attr.y]="space.cy - space.radius"
                      [ngClass]="space.classes"
                      class="base mid-stroke"/>
            }
        }
        @let highCapture = highCaptureMarker();
        @if (highCapture.isPresent()) {
            @let capture = highCapture.get();
            <rect [id]="capture.id"
                  [attr.width]="capture.radius * 2"
                  [attr.height]="capture.radius * 2"
                  [attr.x]="capture.x"
                  [attr.y]="capture.y"
                  class="base captured-fill mid-stroke"/>
        }
        @if (captureValidationVisible()) {
            <g id="capture-validation"
               (click)="validateCapture()"
               [attr.transform]="captureValidationTranslation">
                <circle [attr.cx]="STROKE_WIDTH / 2"
                        [attr.cy]="STROKE_WIDTH / 2"
                        [attr.r]="SPACE_SIZE / 2"
                        fill="red"
                        class="base-no-fill mid-stroke"
                        [ngClass]="captureValidationButtonClasses()"/>
                <polygon points="-32.5,-2.5 -32.5,12.5 -10,35 -2.5,35 35,-21.25 25,-21.275 -5,25 -32.5,-2.5"
                         fill="green"
                         class="base-no-fill mid-stroke"/>
            </g>
        }
        @for (capturable of capturableMarkers(); track capturable.id) {
            <g (click)="onPieceClick(capturable.coord.x, capturable.coord.y, capturable.coord.z)"
               [id]="capturable.id"
               [attr.transform]="capturable.transform">
                <line [attr.x1]="-0.25 * capturable.radius"
                      [attr.y1]="-0.25 * capturable.radius"
                      [attr.x2]="+0.25 * capturable.radius"
                      [attr.y2]="+0.25 * capturable.radius"
                      stroke-width="8"
                      stroke="red"/>
                <line [attr.x1]="+0.25 * capturable.radius"
                      [attr.y1]="-0.25 * capturable.radius"
                      [attr.x2]="-0.25 * capturable.radius"
                      [attr.y2]="+0.25 * capturable.radius"
                      stroke-width="8"
                      stroke="red"/>
            </g>
        }
    </g>
</svg>
