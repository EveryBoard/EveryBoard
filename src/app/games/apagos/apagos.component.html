<svg xmlns="http://www.w3.org/2000/svg"
     class="board"
     [attr.viewBox]="viewBoxString()"
     preserveAspectRatio="xMidYMid meet">
    <g [attr.transform]="'rotate(' + getPointOfView().getValue() * 180 + ' ' + (boardWidth() / 2) + ' ' + (boardHeight() / 2) + ')'">
        @for (remainingPieceOneCx of remainingPieceOneCxList(); track $index) {
            <circle [attr.cx]="remainingPieceOneCx"
                    [attr.cy]="pieceRadius()"
                    [attr.r]="pieceRadius() - 5"
                    class="base mid-stroke player1-fill"/>
        }
        @for (remainingPieceZeroCx of remainingPieceZeroCxList(); track $index) {
            <circle [attr.cx]="remainingPieceZeroCx"
                    [attr.cy]="boardHeight() - pieceRadius()"
                    [attr.r]="pieceRadius() - 5"
                    class="base mid-stroke player0-fill"/>
        }
    </g>

    <g id="board">
        @for (squareInfo of viewInfos(); track $index; let x = $index) {
            <g [attr.transform]="squareInfo.blockTransform">
                @if (squareInfo.canDisplayArrow.get(Player.ZERO)) {
                    <polygon id="drop-arrow-zero-{{ x }}"
                             class="base mid-stroke"
                             [ngClass]="squareInfo.arrowClasses.get(Player.ZERO)"
                             (click)="onArrowClick(x, PlayerOrNone.ZERO)"
                             [attr.points]="ARROW_COORD"
                             [attr.transform]="svgTransformZero"/>
                }
                @if (squareInfo.canDisplayArrow.get(Player.ONE)) {
                    <polygon id="drop-arrow-one-{{ x }}"
                             class="base mid-stroke"
                             [ngClass]="squareInfo.arrowClasses.get(Player.ONE)"
                             (click)="onArrowClick(x, PlayerOrNone.ONE)"
                             [attr.points]="ARROW_COORD"
                             [attr.transform]="svgTransformOne"/>
                }
                <rect id="square-{{ x }}"
                      (click)="onSquareClick(x)"
                      x="0"
                      y="0"
                      [attr.width]="SPACE_SIZE"
                      [attr.height]="SPACE_SIZE"
                      [ngClass]="squareInfo.classes"
                      class="base mid-stroke"/>
                @for (pieceInfo of squareInfo.pieceInfos; track i; let i = $index) {
                    <circle id="square-{{ x }}-piece-{{ i }}-out-of-{{ squareInfo.square.count(PlayerOrNone.NONE) }}"
                            [attr.transform]="pieceInfo.transform"
                            (click)="onSquareClick(x)"
                            r="10"
                            [ngClass]="pieceInfo.classes"
                            class="base mid-stroke"/>
                }
            </g>
        }
    </g>
</svg>
