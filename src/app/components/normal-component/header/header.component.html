<nav class="navbar is-primary"
     role="navigation"
     aria-label="main navigation">
    <div class="navbar-brand">
        <a class="navbar-item"
           [routerLink]="['/']">
            <img id="logo"
                 src="assets/images/logo.png"
                 width="28"
                 height="28">
        </a>
        <button id="menu-button"
                type="button"
                class="navbar-burger has-text-primary-invert"
                [ngClass]="showMenu ? 'is-active' : ''"
                i18n-aria-label
                aria-label="Menu"
                [attr.aria-expanded]="showMenu"
                aria-controls="menu"
                (click)="showMenu = !showMenu">
            <span aria-hidden="true"></span>
            <span aria-hidden="true"></span>
            <span aria-hidden="true"></span>
            <span aria-hidden="true"></span>
        </button>
    </div>

    <div id="menu"
         class="navbar-menu"
         [ngClass]="showMenu ? 'is-active' : ''"
         (click)="showMenu = !showMenu">

        <div class="navbar-start">
            <a id="home"
               class="navbar-item"
               [routerLink]="['/']"
               i18n>Home</a>
            <div class="navbar-item has-dropdown is-hoverable">
                <a class="navbar-link"
                   i18n>Play online</a>
                <div class="navbar-dropdown">
                    <a class="navbar-item"
                       [routerLink]="['/play']"
                       i18n>Create a game</a>
                    <a class="navbar-item"
                       [routerLink]="['/lobby']"
                       i18n>Join a game</a>
                </div>
            </div>
            <div class="navbar-item has-dropdown is-hoverable">
                <a id="playOffline"
                   class="navbar-link"
                   i18n>Play offline</a>
                <div class="navbar-dropdown">
                    <a id="playLocally"
                       class="navbar-item"
                       [routerLink]="['/local']"
                       i18n>Create a game</a>
                    <a id="tutorial"
                       class="navbar-item"
                       [routerLink]="['/tutorial']"
                       i18n>Learn the rules</a>
                </div>
            </div>
        </div>

        <div class="navbar-end">
            @if (currentGame().isPresent()) {
                <a id="currentGameLink"
                   class="navbar-item"
                   (click)="navigateToPart()">{{ currentGameLabel() }}</a>
            }

            <a id="settings"
               role="button"
               tabindex="0"
               class="navbar-item"
               [attr.aria-expanded]="showSettings()"
               aria-controls="settings-modal"
               i18n-aria-label
               aria-label="Settings"
               i18n-data-tooltip
               data-tooltip="Settings"
               (click)="toggleSettings()"
               (keydown.enter)="toggleSettings()"
               (keydown.space)="toggleSettings(); $event.preventDefault()"><fa-icon [icon]="faCog"></fa-icon></a>

            <div class="navbar-item">
                @if (loading()) {
                    <fa-icon id="spinner"
                             [icon]="faSpinner"
                             class="navbar-item"></fa-icon>
                } @else {
                    @if (username().isPresent()) {
                        <div class="navbar-item has-dropdown is-hoverable">
                            <a id="connectedUserName"
                               class="navbar-link">{{ username().get() }}</a>
                            <div class="navbar-dropdown">
                                <a class="navbar-item"
                                   id="account"
                                   routerLink="/account"
                                   i18n>Account</a>
                                <a class="navbar-item"
                                   id="logout"
                                   (click)="logout()"
                                   i18n>Log out</a>
                            </div>
                        </div>
                    } @else {
                        <div class="buttons">
                            <a id="register"
                               class="button is-primary"
                               [routerLink]="['/register']">
                                <strong i18n>Register</strong>
                            </a>
                            <a id="login"
                               class="button is-light"
                               [routerLink]="['/login']"
                               i18n>Log in</a>
                        </div>
                    }
                }
            </div>
        </div>
    </div>
</nav>

@if (showSettings()) {
    <div id="settings-modal"
         class="modal is-active"
         role="dialog"
         aria-modal="true"
         i18n-aria-label
         aria-label="User settings">
        <div id="close-settings-backdrop"
             class="modal-background"
             (click)="closeSettings()"></div>
        <div class="modal-content">
            <app-settings></app-settings>
        </div>
        <button id="close-settings"
                class="modal-close is-large"
                type="button"
                i18n-aria-label
                aria-label="Close settings"
                (click)="closeSettings()"></button>
    </div>
}
