<div class="box">
    <p class="title"
       i18n>User settings</p>
    <div class="field">
        <label class="label"
               for="theme"
               i18n>Theme</label>
        <div class="control">
            <div class="select">
                <select id="theme"
                        (change)="changeTheme($event)">
                    @for (theme of availableThemes; track theme) {
                        <option [value]="theme.value"
                                id="theme_{{ theme.value }}"
                                [selected]="theme.value === currentTheme()">
                            {{ theme.name }}
                        </option>
                    }
                </select>
            </div>
        </div>
    </div>
    <div class="field">
        <label class="label"
               for="language"
               i18n>Language</label>
        <div class="control">
            <div class="select">
                <select id="language"
                        [value]="candidateLanguage() ?? currentLanguage"
                        (change)="changeLanguage($event)">
                    @for (language of availableLanguages; track language) {
                        <option [value]="language.value"
                                id="language_{{ language.value }}"
                                [selected]="language.value === currentLanguage">
                            {{ language.name }}
                        </option>
                    }
                </select>
            </div>
        </div>
    </div>

    @if (candidateLanguage() !== null) {
        <article id="language-change-warning"
                 class="message is-warning"
                 role="alertdialog"
                 aria-modal="true"
                 aria-labelledby="language-change-title"
                 aria-describedby="language-change-description">
            <div class="message-header">
                <p id="language-change-title"
                   i18n>Reload required</p>
            </div>
            <div class="message-body">
                <p id="language-change-description"
                   i18n>
                    Changing the language requires reloading EveryBoard. Your current local game may be lost.
                </p>
                <div class="buttons mt-4">
                    <button id="reload-with-language"
                            class="button is-warning"
                            type="button"
                            (click)="reloadWithCandidateLanguage()"
                            i18n>Reload now</button>
                    <button id="apply-language-next-time"
                            class="button"
                            type="button"
                            (click)="applyCandidateLanguageNextTime()"
                            i18n>Apply next time</button>
                    <button id="cancel-language-change"
                            class="button"
                            type="button"
                            (click)="cancelLanguageChange()"
                            i18n>Cancel</button>
                </div>
            </div>
        </article>
    }
</div>
