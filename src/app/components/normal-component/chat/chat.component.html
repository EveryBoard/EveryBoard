<div>
  <button id="switchChatVisibilityButton"
    class="button is-primary is-fullwidth"
    (click)="switchChatVisibility()">
    @if (visible) {
      <ng-container i18n>Hide chat</ng-container>
    } @else {
      <ng-container i18n>Show chat ({{ unreadMessagesText }})</ng-container>
    }
  </button>

  @if (visible) {
    <div>
      @if (showUnreadMessagesButton) {
        <button
          id="scrollToBottomIndicator"
          class="notification button is-info is-fullwidth"
          (click)="scrollToBottom()"
        >{{ unreadMessagesText }} &darr;</button>
      }
      <div #chatDiv
        id="chatDiv"
        class="is-fullwidth block"
        style="overflow-y:scroll; max-height: 50vh;"
        (scroll)="updateCurrentScrollPosition()"
        >
        @for (msg of chat; track $index) {
          <p>
            [{{ formatTimestamp(msg.timestamp) }}] <b class="chat-sender">{{ msg.sender.name }}</b>:<span class="chat-message">{{ msg.content }}</span>
          </p>
        }
      </div>
    </div>
  }

  @if (visible) {
    <form id="chatForm"
      (onSubmit)="sendMessage()">
      <div class="field has-addons is-fullwidth">
        <div class="control is-expanded">
          <input class="input"
            #message
            id="message"
            type="text"
            placeholder="Type your message here" i18n-placeholder
            maxlength="128"
            value=""
            [(ngModel)]="userMessage"
            [ngModelOptions]="{standalone: true}"/>
          <p class="help">{{ message.value.length }}/128</p>
        </div>
        <div class="control">
          <button class="button is-primary"
            type="submit"
            id="send"
            (click)="sendMessage()">
            <fa-icon [icon]="faReply" class="clickable-icon"></fa-icon>
          </button>
        </div>
      </div>
      <div class="content is-small">
        <p><strong i18n>Be polite</strong></p>
      </div>
    </form>
  }
</div>
