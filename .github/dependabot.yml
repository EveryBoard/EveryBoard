version: 2

updates:
  - package-ecosystem: npm
    directories:
      - /
      - /games
      - /lib
      - /ci/deploy-tools
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Brussels
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
    groups:
      angular:
        patterns:
          - "@angular/*"
          - "@angular-eslint/*"
          - angular-eslint
      safe-npm-updates:
        patterns:
          - "*"
        exclude-patterns:
          - "@angular/*"
          - "@angular-eslint/*"
          - angular-eslint
        update-types:
          - minor
          - patch

  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Brussels
    open-pull-requests-limit: 3
    groups:
      safe-go-updates:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - "*"
