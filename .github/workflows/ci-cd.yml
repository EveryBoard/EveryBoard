name: CI/CD On Action

env:
  GO_VERSION: 1.26
  NODE_VERSION: 24
  PYTHON_VERSION: 3.13

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

jobs:
  build-front:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
      - name: Build in the CI container
        run: make ci-build

  tests-front:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
      - name: Run test suites in the CI container
        run: make ci-frontend

  tests-back:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
      - name: Run backend checks in the CI container
        run: make ci-backend

  e2e:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
      - name: Run E2E checks in the CI container
        run: make ci-e2e

  linter:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
      - name: Run linter in the CI container
        run: make ci-lint

  images:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
      - name: Check game images in the CI container
        run: make ci-images

  translations:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
      - name: Check translations in the CI container
        run: make ci-translations

  deployment:
    runs-on: ubuntu-24.04
    needs: [build-front, tests-front, tests-back, linter, images, translations]
    environment: netlify
    if: github.event_name == 'push' &&
          contains('
            refs/heads/master
            refs/heads/develop
          ', github.ref)
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
      - name: Setup dependencies (setup node)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Setup dependencies (install JS dependencies)
        run: npm ci
      - name: Install pinned deployment tools
        working-directory: ci/deploy-tools
        run: npm ci --allow-remote=all
      - name: Build lib
        run: cd lib && npm run build
      - name: Setup dependencies (setup Firebase config, master)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        run: |
          echo "${{ secrets.FIREBASE_CONFIG_MASTER }}" > src/app/firebaseConfig.ts
      - name: Setup dependencies (setup Firebase config, dev)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
        run: |
          echo "${{ secrets.FIREBASE_CONFIG_DEV }}" > src/app/firebaseConfig.ts
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install OS dependencies
        run: |
          sudo apt-get install -y musl-tools
      - name: Check if push by an org member
        id: is_organization_member
        uses: jamessingleton/is-organization-member@1.1.0
        with:
          organization: EveryBoard
          username: ${{ github.actor }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy master on push if org member
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        run: |
          result="${{ steps.is_organization_member.outputs.result }}"
          if [ "$result" == true ]; then
            # deploy frontend
            NODE_PATH="$GITHUB_WORKSPACE/ci/deploy-tools/node_modules" ./node_modules/.bin/ng deploy --base-href=/ --repo=https://github.com/EveryBoard/master --cname=everyboard.org --message="Deployment from action (commit $GITHUB_SHA)" --name acieroid --email 'everyboard@everyboard.org' --configuration=production --dir dist/everyboard
            # deploy backend
            if ./scripts/backend_needs_deployment.sh https://server.everyboard.org; then
                mkdir -p ~/.ssh/
                cat > ~/.ssh/known_hosts <<< "$SSH_KNOWN_HOSTS"
                cat > ~/.ssh/id_rsa <<< "$SSH_KEY"
                chmod u+rw,go-rw,a-x ~/.ssh/id_rsa
                cat > backend/service-account.json <<< "$SERVICE_ACCOUNT"
                cd backend && \
                    USE_EMULATOR=no PROJECT_ID=firestore-c9d47 ALLOW_ORIGIN='https://everyboard.org' \
                    DATABASE_HOST=db DATABASE_USERNAME=everyboard_master DATABASE_PASSWORD="$DATABASE_PASSWORD" \
                    DISCORD_WEBHOOK_URL="$DISCORD_WEBHOOK_URL" \
                    FRONTEND_URL='https://everyboard.org' \
                    make deploy target=dev user="$SSH_USER" server="$SSH_SERVER" port="$SSH_PORT" listen-port=8003
              fi
          fi
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_GH_TOKEN }}
          SSH_KEY: ${{ secrets.EVERYBOARD_DEPLOY_SSH_KEY }}
          SSH_USER: ${{ secrets.EVERYBOARD_DEPLOY_SSH_USER }}
          SSH_SERVER: ${{ secrets.EVERYBOARD_DEPLOY_SSH_SERVER }}
          SSH_PORT: ${{ secrets.EVERYBOARD_DEPLOY_SSH_PORT }}
          SSH_KNOWN_HOSTS: ${{ secrets.EVERYBOARD_DEPLOY_KNOWN_HOST }}
          SERVICE_ACCOUNT: ${{ secrets.EVERYBOARD_DEPLOY_SERVICE_ACCOUNT_MASTER }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD_MASTER }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      - name: Deploy develop on push if org member
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
        run: |
          result="${{ steps.is_organization_member.outputs.result }}"
          if [ $result == true ]; then
            # deploy frontend
            NODE_PATH="$GITHUB_WORKSPACE/ci/deploy-tools/node_modules" ./node_modules/.bin/ng deploy --base-href=/ --repo=https://github.com/EveryBoard/develop --cname=dev.everyboard.org --message="Deployment from action (commit $GITHUB_SHA)" --name acieroid --email 'everyboard@everyboard.org' --configuration=dev --dir dist/everyboard
            # deploy backend
            if ./scripts/backend_needs_deployment.sh https://server-dev.everyboard.org; then
                mkdir -p ~/.ssh/
                cat > ~/.ssh/known_hosts <<< "$SSH_KNOWN_HOSTS"
                cat > ~/.ssh/id_rsa <<< "$SSH_KEY"
                chmod u+rw,go-rw,a-x ~/.ssh/id_rsa
                cat > backend/service-account.json <<< "$SERVICE_ACCOUNT"
                cd backend && \
                    USE_EMULATOR=no PROJECT_ID=everyboard-test ALLOW_ORIGIN='https://dev.everyboard.org' \
                    DATABASE_HOST=db DATABASE_USERNAME=everyboard_dev DATABASE_PASSWORD="$DATABASE_PASSWORD" \
                    DISCORD_WEBHOOK_URL="$DISCORD_WEBHOOK_URL" \
                    FRONTEND_URL='https://dev.everyboard.org' \
                    make deploy target=dev user="$SSH_USER" server="$SSH_SERVER" port="$SSH_PORT" listen-port=8002
            fi
          fi
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_GH_TOKEN }}
          SSH_KEY: ${{ secrets.EVERYBOARD_DEPLOY_SSH_KEY }}
          SSH_USER: ${{ secrets.EVERYBOARD_DEPLOY_SSH_USER }}
          SSH_SERVER: ${{ secrets.EVERYBOARD_DEPLOY_SSH_SERVER }}
          SSH_PORT: ${{ secrets.EVERYBOARD_DEPLOY_SSH_PORT }}
          SSH_KNOWN_HOSTS: ${{ secrets.EVERYBOARD_DEPLOY_KNOWN_HOST }}
          SERVICE_ACCOUNT: ${{ secrets.EVERYBOARD_DEPLOY_SERVICE_ACCOUNT_DEV }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD_DEV }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

  deployment-netlify:
    runs-on: ubuntu-24.04
    needs: [build-front]
    environment: netlify
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
      - name: Setup dependencies (setup node)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Setup dependencies (install dependencies)
        run: npm ci
      - name: Install pinned deployment tools
        working-directory: ci/deploy-tools
        run: npm ci --allow-remote=all
      - name: Build lib
        run: cd lib && npm run build
      - name: Setup dependencies (setup Firebase config, others)
        if: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/develop' }}
        run: |
          cp src/app/firebaseConfig.test.ts src/app/firebaseConfig.ts
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install OS dependencies
        run: |
          sudo apt-get install -y musl-tools
      - name: Check if push by an org member
        id: is_organization_member
        uses: jamessingleton/is-organization-member@1.1.0
        with:
          organization: EveryBoard
          username: ${{ github.actor }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy feature branch if org member
        if: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/develop' }}
        run: |
          result="${{ steps.is_organization_member.outputs.result }}"
          if [ "$result" == true ]; then
            status=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" https://api.netlify.com/api/v1/user)
            [ "$status" = 200 ] || { echo "Netlify token rejected (HTTP $status)"; exit 1; }
            npm run build:netlify
            echo "deploying"
            ./ci/deploy-tools/node_modules/.bin/netlify deploy --dir=dist/everyboard --alias="$GITHUB_HEAD_REF" --message="Deployment from github ($GITHUB_HEAD_REF, commit $GITHUB_SHA)"
            # deploy backend
            if ./scripts/backend_needs_deployment.sh https://server-test.everyboard.org; then
                mkdir -p ~/.ssh/
                cat > ~/.ssh/known_hosts <<< "$SSH_KNOWN_HOSTS"
                cat > ~/.ssh/id_rsa <<< "$SSH_KEY"
                chmod u+rw,go-rw,a-x ~/.ssh/id_rsa
                cat > backend/service-account.json <<< "$SERVICE_ACCOUNT"
                cd backend && \
                  USE_EMULATOR=no PROJECT_ID=everyboard-test ALLOW_ORIGIN='*' \
                    DATABASE_HOST=db DATABASE_USERNAME=everyboard_test DATABASE_PASSWORD="$DATABASE_PASSWORD" \
                    DISCORD_WEBHOOK_URL="$DISCORD_WEBHOOK_URL" \
                    FRONTEND_URL="https://$GITHUB_HEAD_REF--everyboard.netlify.app" \
                    make deploy target=test user="$SSH_USER" server="$SSH_SERVER" port="$SSH_PORT" listen-port=8001
            fi
          fi
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          SSH_KEY: ${{ secrets.EVERYBOARD_DEPLOY_SSH_KEY }}
          SSH_USER: ${{ secrets.EVERYBOARD_DEPLOY_SSH_USER }}
          SSH_SERVER: ${{ secrets.EVERYBOARD_DEPLOY_SSH_SERVER }}
          SSH_PORT: ${{ secrets.EVERYBOARD_DEPLOY_SSH_PORT }}
          SSH_KNOWN_HOSTS: ${{ secrets.EVERYBOARD_DEPLOY_KNOWN_HOST }}
          SERVICE_ACCOUNT: ${{ secrets.EVERYBOARD_DEPLOY_SERVICE_ACCOUNT_TEST }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD_TEST }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
