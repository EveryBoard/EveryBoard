[package]
name = "backend-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.12", features = ["full"] }
tokio-stream = "0.1"
tokio-tungstenite = "0.23.1"
anyhow = "1.0"
futures-util = "0.3"
jsonwebtoken = "9"
serde = { version = "1.0", features = ["derive"] }
once_cell = "1"
reqwest = { version = "0.11", features = ["json"] }
thiserror = "2"
