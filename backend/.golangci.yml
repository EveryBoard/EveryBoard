version: "2"

linters:
  default: none
  enable:
    - exhaustruct_v5
    - govet
    - ineffassign
    - unused
  settings:
    exhaustruct_v5:
      explicit-mode: true
      allow-empty: true
      enforce-patterns:
        - '^github\.com/EveryBoard/EveryBoard/internal/everyboard/model\.CurrentGame$'
  exclusions:
    rules:
      - path: '_test\.go$'
        linters:
          - exhaustruct_v5
