version: "2"

linters:
    default: standard
    enable:
        - bodyclose
        - containedctx
        - contextcheck
        - durationcheck
        - errorlint
        - exhaustive
        - fatcontext
        - gosec
        - loggercheck
        - makezero
        - misspell
        - modernize
        - musttag
        - nilerr
        - noctx
        - perfsprint
        - reassign
        - revive
        - rowserrcheck
        - sqlclosecheck
        - testifylint
        - unconvert
        - usestdlibvars
    settings:
        revive:
            enable-default-rules: true
            rules:
                - name: exported
                  disabled: true
                - name: package-comments
                  disabled: true
                - name: var-naming
                  disabled: true

formatters:
    enable:
        - gofmt
        - goimports

run:
    timeout: 5m
