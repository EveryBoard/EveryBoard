version: "2"

linters:
    default: standard
    enable:
        - asasalint
        - bidichk
        - bodyclose
        - canonicalheader
        - containedctx
        - contextcheck
        - durationcheck
        - dupword
        - errorlint
        - exhaustive
        - exhaustruct_v5
        - fatcontext
        - gocritic
        - gosec
        - loggercheck
        - makezero
        - misspell
        - modernize
        - musttag
        - nilerr
        - noctx
        - nolintlint
        - perfsprint
        - reassign
        - revive
        - rowserrcheck
        - sqlclosecheck
        - testifylint
        - unconvert
        - usestdlibvars
    settings:
        exhaustruct_v5:
            explicit-mode: true
            allow-empty: true
            enforce-patterns:
                - '^github\.com/EveryBoard/EveryBoard/internal/everyboard/model\.CurrentGame$'
        gocritic:
            disabled-checks:
                - ifElseChain
        revive:
            enable-default-rules: true
            rules:
                - name: exported
                  disabled: true
                - name: package-comments
                  disabled: true
                - name: var-naming
                  disabled: true
    exclusions:
        rules:
            - path: '_test\.go$'
              linters:
                  - exhaustruct_v5

formatters:
    enable:
        - gofmt
        - goimports

run:
    timeout: 5m
