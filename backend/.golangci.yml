version: "2"

linters:
    default: standard
    enable:
        - bodyclose
        - errorlint
        - exhaustive
        - gosec
        - misspell
        - nilerr
        - noctx
        - revive
        - sqlclosecheck
        - testifylint
    settings:
        revive:
            enable-default-rules: true
            rules:
                - name: exported
                  disabled: true
                - name: package-comments
                  disabled: true
                - name: var-naming
                  disabled: true

formatters:
    enable:
        - gofmt
        - goimports

run:
    timeout: 5m
